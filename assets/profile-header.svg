<svg width="1200" height="500" viewBox="0 0 1200 500" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Dilash — Product Engineer launch console</title>
  <desc id="desc">An animated product launch control room showing Dilash as an independent product engineer and Everlift as a live flagship product.</desc>

  <defs>
    <linearGradient id="bg" x1="40" y1="20" x2="1160" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070A11"/>
      <stop offset="0.52" stop-color="#0A111D"/>
      <stop offset="1" stop-color="#0D1724"/>
    </linearGradient>
    <linearGradient id="border" x1="20" y1="20" x2="1180" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#21D4FD"/>
      <stop offset="0.42" stop-color="#7CFFB2"/>
      <stop offset="0.72" stop-color="#F5B942"/>
      <stop offset="1" stop-color="#FF6B35"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#21D4FD"/>
      <stop offset="0.55" stop-color="#7CFFB2"/>
      <stop offset="1" stop-color="#F5B942"/>
    </linearGradient>
    <radialGradient id="cyanGlow">
      <stop stop-color="#21D4FD" stop-opacity=".18"/>
      <stop offset="1" stop-color="#21D4FD" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="greenGlow">
      <stop stop-color="#4ADE80" stop-opacity=".16"/>
      <stop offset="1" stop-color="#4ADE80" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#9FB4C9" stroke-opacity=".055"/>
      <circle cx="1" cy="1" r=".8" fill="#B6C8D9" fill-opacity=".08"/>
    </pattern>
    <pattern id="microGrid" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M12 0H0V12" stroke="#A8BDD0" stroke-opacity=".04"/>
    </pattern>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#000" flood-opacity=".35"/>
    </filter>
    <clipPath id="frameClip">
      <rect x="1" y="1" width="1198" height="498" rx="28"/>
    </clipPath>
    <clipPath id="rightClip">
      <rect x="770" y="92" width="392" height="332" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frameClip)">
    <rect width="1200" height="500" fill="url(#bg)"/>
    <rect width="1200" height="500" fill="url(#grid)"/>
    <circle cx="155" cy="130" r="290" fill="url(#cyanGlow)">
      <animate attributeName="cx" values="155;520;155" dur="18s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1040" cy="330" r="250" fill="url(#greenGlow)">
      <animate attributeName="cy" values="330;140;330" dur="15s" repeatCount="indefinite"/>
    </circle>

    <g opacity=".28">
      <circle cx="1030" cy="78" r="94" stroke="#21D4FD" stroke-dasharray="2 9">
        <animateTransform attributeName="transform" type="rotate" from="0 1030 78" to="360 1030 78" dur="28s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1030" cy="78" r="72" stroke="#4ADE80" stroke-opacity=".5" stroke-dasharray="24 12">
        <animateTransform attributeName="transform" type="rotate" from="360 1030 78" to="0 1030 78" dur="20s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1030" cy="-16" r="4" fill="#21D4FD" filter="url(#softGlow)"/>
    </g>

    <g filter="url(#shadow)">
      <rect x="38" y="28" width="1124" height="48" rx="14" fill="#0A111B" fill-opacity=".9" stroke="#B7C8D8" stroke-opacity=".15"/>
      <rect x="38" y="92" width="712" height="332" rx="18" fill="#09111C" fill-opacity=".82" stroke="#B7C8D8" stroke-opacity=".13"/>
      <rect x="770" y="92" width="392" height="332" rx="18" fill="#09131D" fill-opacity=".92" stroke="#B7C8D8" stroke-opacity=".16"/>
    </g>

    <circle cx="62" cy="52" r="4" fill="#FF6B6B"/>
    <circle cx="78" cy="52" r="4" fill="#F5B942"/>
    <circle cx="94" cy="52" r="4" fill="#4ADE80"/>
    <text x="118" y="57" fill="#A8BACB" font-family="Menlo" font-size="12" letter-spacing="2.2">DILASH // PRODUCT CONTROL ROOM</text>
    <circle cx="1015" cy="52" r="5" fill="#4ADE80" filter="url(#softGlow)">
      <animate attributeName="opacity" values=".35;1;.35" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="1030" y="57" fill="#7CFFB2" font-family="Menlo" font-size="11" letter-spacing="1.6">SYSTEM ONLINE</text>

    <text x="68" y="125" fill="#21D4FD" font-family="Menlo" font-size="11" letter-spacing="2.4">01 // IDENTITY</text>
    <text x="66" y="198" fill="#F7FAFC" font-family="Arial" font-size="68" font-weight="700">DILASH</text>
    <text x="70" y="230" fill="#AFC1D2" font-family="Menlo" font-size="16" letter-spacing="5">PRODUCT ENGINEER</text>
    <rect x="68" y="250" width="598" height="1" fill="url(#line)" opacity=".42"/>

    <text x="68" y="290" fill="#F7FAFC" font-family="Arial" font-size="23" font-weight="600">Two training apps. One shipped, one for me.</text>

    <g font-family="Menlo" font-size="10" letter-spacing="1.2">
      <g>
        <rect x="68" y="315" width="116" height="29" rx="8" fill="#0D2130" stroke="#21D4FD" stroke-opacity=".36"/>
        <circle cx="84" cy="329.5" r="3" fill="#21D4FD"/>
        <text x="94" y="333" fill="#B9EFFF">MOBILE</text>
      </g>
      <g>
        <rect x="194" y="315" width="88" height="29" rx="8" fill="#11251D" stroke="#4ADE80" stroke-opacity=".36"/>
        <circle cx="210" cy="329.5" r="3" fill="#4ADE80"/>
        <text x="220" y="333" fill="#C5FDD7">AI</text>
      </g>
      <g>
        <rect x="292" y="315" width="104" height="29" rx="8" fill="#251D10" stroke="#F5B942" stroke-opacity=".36"/>
        <circle cx="308" cy="329.5" r="3" fill="#F5B942"/>
        <text x="318" y="333" fill="#FFE4A3">DATA</text>
      </g>
      <g>
        <rect x="406" y="315" width="152" height="29" rx="8" fill="#1A1726" stroke="#A78BFA" stroke-opacity=".36"/>
        <circle cx="422" cy="329.5" r="3" fill="#A78BFA"/>
        <text x="432" y="333" fill="#DED5FF">LOCAL-FIRST</text>
      </g>
    </g>

    <text x="68" y="375" fill="#708397" font-family="Menlo" font-size="9" letter-spacing="1.6">EVERLIFT // 2026</text>
    <line x1="90" y1="397" x2="694" y2="397" stroke="#466071" stroke-opacity=".72"/>
    <line x1="90" y1="397" x2="694" y2="397" stroke="url(#line)" stroke-width="2" stroke-dasharray="34 570">
      <animate attributeName="stroke-dashoffset" values="0;-604" dur="3.8s" repeatCount="indefinite"/>
    </line>
    <g font-family="Menlo" font-size="9" letter-spacing="1.2">
      <g><circle cx="90" cy="397" r="6" fill="#0B1420" stroke="#21D4FD"/><text x="61" y="416" fill="#7F94A7">JAN 2026</text></g>
      <g><circle cx="292" cy="397" r="6" fill="#0B1420" stroke="#48E5C2"/><text x="260" y="416" fill="#7F94A7">APP STORE</text></g>
      <g><circle cx="493" cy="397" r="6" fill="#0B1420" stroke="#A7E163"/><text x="453" y="416" fill="#7F94A7">GOOGLE PLAY</text></g>
      <g><circle cx="694" cy="397" r="7" fill="#4ADE80" filter="url(#softGlow)"/><text x="669" y="416" fill="#7CFFB2">v1.0.12</text></g>
    </g>

    <g clip-path="url(#rightClip)">
      <rect x="770" y="92" width="392" height="332" fill="url(#microGrid)"/>
      <rect x="770" y="92" width="392" height="42" fill="#0D1A25"/>
      <rect x="790" y="109" width="6" height="6" rx="3" fill="#4ADE80" filter="url(#softGlow)">
        <animate attributeName="opacity" values=".25;1;.25" dur="1.6s" repeatCount="indefinite"/>
      </rect>
      <text x="806" y="117" fill="#9DB0C2" font-family="Menlo" font-size="10" letter-spacing="1.8">SHIP LOG // FLAGSHIP</text>
      <rect x="1089" y="104" width="52" height="20" rx="10" fill="#123522" stroke="#4ADE80" stroke-opacity=".55"/>
      <text x="1103" y="118" fill="#7CFFB2" font-family="Menlo" font-size="9" letter-spacing="1.4">LIVE</text>

      <text x="794" y="177" fill="#F7FAFC" font-family="Arial" font-size="34" font-weight="700">EVERLIFT</text>
      <text x="796" y="199" fill="#AFC1D2" font-family="Menlo" font-size="10" letter-spacing="2.3">WORKOUT · LOG · ASCEND</text>

      <g>
        <rect x="794" y="220" width="104" height="55" rx="11" fill="#0C1924" stroke="#21D4FD" stroke-opacity=".25"/>
        <text x="808" y="240" fill="#71869A" font-family="Menlo" font-size="8" letter-spacing="1.3">PLATFORMS</text>
        <text x="808" y="262" fill="#F7FAFC" font-family="Arial" font-size="18" font-weight="700">02</text>
      </g>
      <g>
        <rect x="908" y="220" width="104" height="55" rx="11" fill="#0C1924" stroke="#4ADE80" stroke-opacity=".25"/>
        <text x="922" y="240" fill="#71869A" font-family="Menlo" font-size="8" letter-spacing="1.3">LANGUAGES</text>
        <text x="922" y="262" fill="#F7FAFC" font-family="Arial" font-size="18" font-weight="700">09</text>
      </g>
      <g>
        <rect x="1022" y="220" width="118" height="55" rx="11" fill="#0C1924" stroke="#F5B942" stroke-opacity=".25"/>
        <text x="1036" y="240" fill="#71869A" font-family="Menlo" font-size="8" letter-spacing="1.3">EXERCISES</text>
        <text x="1036" y="262" fill="#F7FAFC" font-family="Arial" font-size="18" font-weight="700">400+</text>
      </g>

      <text x="794" y="303" fill="#708397" font-family="Menlo" font-size="8" letter-spacing="1.5">RELEASE SIGNAL</text>
      <path d="M794 348 C818 345 825 331 844 334 C864 337 870 322 892 326 C913 329 924 303 946 311 C967 319 975 290 998 299 C1019 307 1028 284 1050 291 C1071 298 1082 272 1103 283 C1119 291 1127 276 1142 278" stroke="#35566A" stroke-width="9" stroke-linecap="round"/>
      <path d="M794 348 C818 345 825 331 844 334 C864 337 870 322 892 326 C913 329 924 303 946 311 C967 319 975 290 998 299 C1019 307 1028 284 1050 291 C1071 298 1082 272 1103 283 C1119 291 1127 276 1142 278" stroke="url(#line)" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="10 8">
        <animate attributeName="stroke-dashoffset" values="0;-72" dur="3s" repeatCount="indefinite"/>
      </path>
      <circle cx="1142" cy="278" r="4" fill="#7CFFB2" filter="url(#softGlow)"/>

      <rect x="794" y="371" width="346" height="32" rx="9" fill="#0C1924" stroke="#AFC1D2" stroke-opacity=".12"/>
      <text x="808" y="391" fill="#7CFFB2" font-family="Menlo" font-size="9" letter-spacing="1">● APP STORE</text>
      <text x="902" y="391" fill="#7CFFB2" font-family="Menlo" font-size="9" letter-spacing="1">● GOOGLE PLAY</text>
      <text x="1022" y="391" fill="#708397" font-family="Menlo" font-size="9">BUILD 1.0.11</text>

      <rect x="770" y="88" width="392" height="70" fill="url(#line)" opacity=".045">
        <animate attributeName="y" values="84;424;84" dur="5.5s" repeatCount="indefinite"/>
      </rect>
    </g>

    <rect x="38" y="444" width="1124" height="32" rx="10" fill="#09111B" stroke="#AFC1D2" stroke-opacity=".12"/>
    <text x="58" y="464" fill="#6F8294" font-family="Menlo" font-size="9" letter-spacing="1.7">CURRENT SIGNAL</text>
    <circle cx="183" cy="460" r="3" fill="#4ADE80"/>
    <g font-family="Menlo" font-size="9" letter-spacing="1.5">
      <text x="201" y="464" fill="#B6C7D6">414 EXERCISES</text>
      <text x="378" y="464" fill="#405467">/</text>
      <text x="405" y="464" fill="#B6C7D6">9 LANGUAGES</text>
      <text x="530" y="464" fill="#405467">/</text>
      <text x="557" y="464" fill="#B6C7D6">NO ADS, NO ACCOUNT</text>
      <text x="737" y="464" fill="#405467">/</text>
      <text x="764" y="464" fill="#B6C7D6">WORKS WITH NO SIGNAL</text>
    </g>
  </g>

  <rect x="1" y="1" width="1198" height="498" rx="28" stroke="url(#border)" stroke-opacity=".48" stroke-width="2"/>
</svg>
